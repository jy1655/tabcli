[package]
name = "agent-bridge"
version = "0.1.0"
edition = "2024"
description = "Visible terminal bridge for Codex, Claude, Agy, and Pi CLIs"
license = "MIT"
rust-version = "1.88"

[dependencies]
anyhow = "1.0"
crossbeam-channel = "0.5"
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
tempfile = "3.20"
vt100 = "0.16"

[target.'cfg(not(windows))'.dependencies]
portable-pty = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
conpty = "0.7"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
