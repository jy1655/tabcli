[package]
name = "agent-bridge"
version = "0.0.2"
edition = "2024"
description = "Visible terminal bridge for Codex, Claude, Agy, and Pi CLIs"
license = "MIT"
repository = "https://github.com/jy1655/agent-bridge"
readme = "README.md"
rust-version = "1.97.1"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
tempfile = "3.20"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
