[package]
name = "tabcli"
version = "0.3.0"
edition = "2024"
description = "Terminal Agent Bridge (TAB): run Codex, Claude Code, Agy, and Pi CLIs in visible terminal tabs"
license = "MIT"
repository = "https://github.com/jy1655/tabcli"
readme = "README.md"
rust-version = "1.97.1"

keywords = ["cli", "terminal", "coding-agents", "codex", "claude"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "agent_bridge"

[[bin]]
name = "tabcli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
tempfile = "3.20"
toml = { version = "0.8", default-features = false, features = ["parse"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
