name: Release diagnostic (no publication)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Recorded release tag (diagnostic source is pinned)
        required: true
        type: string
permissions:
  contents: read
jobs:
  claude-module-macos:
    runs-on: macos-15
    timeout-minutes: 10
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ad4d7b4de977277475e3307738e4279008729f60
          persist-credentials: false
      - name: Install pinned toolchain and identify runtime
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          node --version
          uname -a
          git rev-parse HEAD
      - name: Expose scenario boundaries without changing provider code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('tests/claude_completion.rs')
          source=path.read_text()
          source=source.replace('        let output = Command::new("node")', '        eprintln!("diagnostic scenario start: {scenario}");\n        let output = Command::new("node")')
          source=source.replace('        assert!(\n            output.status.success(),', '        eprintln!("diagnostic scenario finish: {scenario}: {}", output.status);\n        assert!(\n            output.status.success(),')
          path.write_text(source)
          PY
      - name: Repeat original Node harness with a process-tree timeout
        run: |
          python3 -u - <<'PY'
          import os,signal,subprocess,sys
          for attempt in range(1,4):
              print(f'diagnostic attempt {attempt}',flush=True)
              process=subprocess.Popen(['cargo','test','--locked','--test','claude_completion','--','--nocapture','--test-threads=1'],start_new_session=True)
              try:
                  code=process.wait(timeout=180)
              except subprocess.TimeoutExpired:
                  rows=subprocess.check_output(['ps','-axo','pid=,ppid=,comm='],text=True)
                  parsed=[line.strip().split(None,2) for line in rows.splitlines()]
                  descendants={process.pid}
                  while True:
                      added={int(pid) for pid,parent,*_ in parsed if int(parent) in descendants}-descendants
                      if not added: break
                      descendants.update(added)
                  for row in parsed:
                      if int(row[0]) in descendants:
                          print('stalled descendant',row,flush=True)
                          if row[2].endswith('/tabcli') or row[2].endswith('/node'):
                              subprocess.run(['sample',row[0],'1','1','-file',f'diagnostic-sample-{row[0]}.txt'],timeout=15,check=False)
                  os.killpg(process.pid,signal.SIGKILL)
                  process.wait()
                  raise SystemExit('diagnostic timeout: isolated process group stopped after samples')
              if code: raise SystemExit(code)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: macos-stall-diagnostic
          path: diagnostic-sample-*.txt
          if-no-files-found: ignore