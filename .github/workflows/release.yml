name: Release

on:
  push:
    tags:
      - "v*"
  # A rehearsal runs every check and build for an existing tag and never publishes.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rehearse, for example v0.0.5
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.version.outputs.notes }}
      package: ${{ steps.version.outputs.package }}
      commit: ${{ steps.version.outputs.commit }}
      tag_object: ${{ steps.version.outputs.tag_object }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "release tag '$RELEASE_TAG' is not vMAJOR.MINOR.PATCH"
          tag_version="${RELEASE_TAG#v}"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test "$tag_version" = "$cargo_version" || fail "tag $RELEASE_TAG does not match Cargo version $cargo_version"
          # actions/checkout rewrites the local tag ref to the commit, and no credentials
          # remain for another fetch, so the annotated tag is verified on the remote.
          read -r ref_type ref_sha < <(gh api "repos/${GH_REPO}/git/ref/tags/${RELEASE_TAG}" --jq '[.object.type, .object.sha] | @tsv') \
            || fail "tag $RELEASE_TAG does not exist on the remote"
          test "$ref_type" = "tag" || fail "tag $RELEASE_TAG is not an annotated tag"
          read -r tag_name target_type tag_commit < <(gh api "repos/${GH_REPO}/git/tags/${ref_sha}" --jq '[.tag, .object.type, .object.sha] | @tsv') \
            || fail "annotated tag object $ref_sha could not be read"
          test "$tag_name" = "$RELEASE_TAG" || fail "tag object names '$tag_name'"
          test "$target_type" = "commit" || fail "tag $RELEASE_TAG points at a $target_type"
          test "$tag_commit" = "$(git rev-parse 'HEAD^{commit}')" || fail "checked-out commit is not the commit of $RELEASE_TAG"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$tag_commit" = "$(git rev-parse "$GITHUB_SHA^{commit}")" || fail "pushed ref is not the commit of $RELEASE_TAG"
          fi
          git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null || fail "origin/main was not fetched"
          git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main || fail "commit of $RELEASE_TAG is not contained in main"
          package="$(awk '
            /^\[package\]$/ { in_package = 1; next }
            /^\[/ { in_package = 0 }
            in_package && /^name = "/ { sub(/^name = "/, ""); sub(/".*$/, ""); print }
          ' Cargo.toml)"
          case "$package" in
            tabcli) test -f THIRD_PARTY_NOTICES.md || fail "THIRD_PARTY_NOTICES.md is missing" ;;
            agent-bridge) ;;
            *) fail "unsupported Cargo package: $package" ;;
          esac
          notes="docs/releases/$tag_version.md"
          test -f "$notes" || fail "$notes is missing"
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          # A tag can be moved while this run is in progress. Later jobs build this commit and
          # publish only while the remote tag is still this tag object.
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"
          echo "tag_object=$ref_sha" >> "$GITHUB_OUTPUT"
      - name: Require immutable releases before building
        env:
          GH_TOKEN: ${{ secrets.IMMUTABLE_RELEASES_READ_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::warning::IMMUTABLE_RELEASES_READ_TOKEN is not configured; a real release stops here."
              exit 0
            fi
            echo "::error::IMMUTABLE_RELEASES_READ_TOKEN is not configured."
            exit 1
          fi
          gh api "repos/${GH_REPO}/immutable-releases" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            --jq 'select(.enabled == true) | .enabled' | grep -qx true

  test:
    needs: validate
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component rustfmt,clippy
      - name: Install macOS terminal apps for AppleScript compile tests
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install --cask ghostty iterm2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features -- --test-threads=1

  build:
    needs: [validate, test]
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
      PACKAGE: ${{ needs.validate.outputs.package }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      TARGET: ${{ matrix.target }}
      ARCHIVE: ${{ matrix.archive }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            archive: ${{ needs.validate.outputs.package }}-${{ needs.validate.outputs.version }}-aarch64-apple-darwin.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: ${{ needs.validate.outputs.package }}-${{ needs.validate.outputs.version }}-x86_64-pc-windows-msvc.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --target $env:TARGET
      - shell: pwsh
        run: cargo build --release --locked --target $env:TARGET
      - name: Verify binary version
        shell: pwsh
        run: |
          $suffix = if ($IsWindows) { ".exe" } else { "" }
          $binary = Join-Path "target/$env:TARGET/release" "$env:PACKAGE$suffix"
          $actual = & $binary --version
          if ($LASTEXITCODE -ne 0 -or $actual.Trim() -cne "$env:PACKAGE $env:RELEASE_VERSION") {
            throw "unexpected binary version: $actual"
          }
      - name: Package macOS archive and checksum
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/agent-bridge-package"
          verify="$RUNNER_TEMP/agent-bridge-verify"
          mkdir -p "$stage" "$verify"
          members=("$PACKAGE" LICENSE)
          if [ "$PACKAGE" = tabcli ]; then
            members+=(THIRD_PARTY_NOTICES.md)
          fi
          cp "target/$TARGET/release/$PACKAGE" "$stage/$PACKAGE"
          cp LICENSE "$stage/LICENSE"
          if [ "$PACKAGE" = tabcli ]; then
            cp THIRD_PARTY_NOTICES.md "$stage/THIRD_PARTY_NOTICES.md"
          fi
          tar -C "$stage" -czf "$ARCHIVE" "${members[@]}"
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          shasum -a 256 -c "$ARCHIVE.sha256"
          test "$(tar -tzf "$ARCHIVE" | LC_ALL=C sort)" = "$(printf '%s\n' "${members[@]}" | LC_ALL=C sort)"
          tar -C "$verify" -xzf "$ARCHIVE"
          test "$("$verify/$PACKAGE" --version)" = "$PACKAGE $RELEASE_VERSION"
      - name: Package Windows archive and checksum
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = $env:ARCHIVE
          $stage = Join-Path $env:RUNNER_TEMP "agent-bridge-package"
          $verify = Join-Path $env:RUNNER_TEMP "agent-bridge-verify"
          New-Item -ItemType Directory -Force -Path $stage, $verify | Out-Null
          $members = @("$env:PACKAGE.exe", "LICENSE")
          if ($env:PACKAGE -eq "tabcli") { $members += "THIRD_PARTY_NOTICES.md" }
          Copy-Item "target/$env:TARGET/release/$env:PACKAGE.exe" "$stage/$env:PACKAGE.exe"
          Copy-Item LICENSE "$stage/LICENSE"
          if ($env:PACKAGE -eq "tabcli") { Copy-Item THIRD_PARTY_NOTICES.md "$stage/THIRD_PARTY_NOTICES.md" }
          Compress-Archive -LiteralPath @($members | ForEach-Object { Join-Path $stage $_ }) -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -Encoding ascii -NoNewline "$archive.sha256"
          $expected = (Get-Content "$archive.sha256").Split()[0]
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant() -ne $expected) { throw "checksum mismatch" }
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $archive).Path)
          try {
            $actualMembers = @($zip.Entries | ForEach-Object { $_.FullName } | Sort-Object)
            if (($actualMembers -join "`n") -cne (($members | Sort-Object) -join "`n")) { throw "unexpected archive members" }
          } finally { $zip.Dispose() }
          Expand-Archive -LiteralPath $archive -DestinationPath $verify
          $actual = & "$verify/$env:PACKAGE.exe" --version
          if ($LASTEXITCODE -ne 0 -or $actual.Trim() -cne "$env:PACKAGE $env:RELEASE_VERSION") { throw "unexpected binary version: $actual" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
          if-no-files-found: error

  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: dist
          merge-multiple: true
      - name: Verify downloaded release assets
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          PACKAGE: ${{ needs.validate.outputs.package }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          test "$(find . -maxdepth 1 -type f | wc -l | tr -d ' ')" = "4"
          macos="$PACKAGE-$RELEASE_VERSION-aarch64-apple-darwin.tar.gz"
          windows="$PACKAGE-$RELEASE_VERSION-x86_64-pc-windows-msvc.zip"
          test "$(find . -mindepth 1 -maxdepth 1 -exec basename {} \; | LC_ALL=C sort)" = "$(printf '%s\n' "$macos" "$macos.sha256" "$windows" "$windows.sha256" | LC_ALL=C sort)"
          sha256sum -c ./*.sha256
          case "$PACKAGE" in
            tabcli) notices="THIRD_PARTY_NOTICES.md " ;;
            agent-bridge) notices="" ;;
            *) echo "::error::unsupported package: $PACKAGE"; exit 1 ;;
          esac
          test "$(tar -tzf "$PACKAGE-$RELEASE_VERSION-aarch64-apple-darwin.tar.gz" | LC_ALL=C sort | tr '\n' ' ')" = "LICENSE $notices$PACKAGE "
          test "$(unzip -Z1 "$PACKAGE-$RELEASE_VERSION-x86_64-pc-windows-msvc.zip" | LC_ALL=C sort | tr '\n' ' ')" = "LICENSE $notices$PACKAGE.exe "
      - name: Require immutable releases before publication
        env:
          GH_TOKEN: ${{ secrets.IMMUTABLE_RELEASES_READ_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::warning::IMMUTABLE_RELEASES_READ_TOKEN is not configured; a real release stops here."
              exit 0
            fi
            echo "::error::IMMUTABLE_RELEASES_READ_TOKEN is not configured."
            exit 1
          fi
          gh api "repos/${GH_REPO}/immutable-releases" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            --jq 'select(.enabled == true) | .enabled' | grep -qx true
      - name: Publish verified release assets
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTES_FILE: ${{ needs.validate.outputs.notes }}
          VALIDATED_TAG_OBJECT: ${{ needs.validate.outputs.tag_object }}
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          # The release attaches to the tag by name, so the tag must still be the validated object.
          read -r ref_type ref_sha < <(gh api "repos/${GH_REPO}/git/ref/tags/${RELEASE_TAG}" --jq '[.object.type, .object.sha] | @tsv') \
            || fail "tag $RELEASE_TAG does not exist on the remote"
          { test "$ref_type" = "tag" && test "$ref_sha" = "$VALIDATED_TAG_OBJECT"; } || fail "tag $RELEASE_TAG changed after validation"
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag \
            --generate-notes \
            --notes-file "$NOTES_FILE" \
            --title "$RELEASE_TAG" \
            --draft
      - name: Verify draft assets and publish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VALIDATED_TAG_OBJECT: ${{ needs.validate.outputs.tag_object }}
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          tag_is_validated() {
            local ref_type ref_sha
            read -r ref_type ref_sha < <(gh api "repos/${GH_REPO}/git/ref/tags/${RELEASE_TAG}" --jq '[.object.type, .object.sha] | @tsv') || return 1
            test "$ref_type" = "tag" && test "$ref_sha" = "$VALIDATED_TAG_OBJECT"
          }
          expected="$(cd dist && for asset in *; do echo "$asset sha256:$(sha256sum "$asset" | cut -d ' ' -f 1)"; done | LC_ALL=C sort)"
          actual="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[] | "\(.name) \(.digest)"' | LC_ALL=C sort)"
          test "$actual" = "$expected" || fail "draft assets differ from the built assets"
          tag_is_validated || fail "tag $RELEASE_TAG changed after validation"
          gh release edit "$RELEASE_TAG" --draft=false
          # Publication cannot be undone: the release must already be immutable and the tag
          # must still be the validated object, which immutability now keeps in place.
          test "$(gh release view "$RELEASE_TAG" --json isDraft,isImmutable --jq '[.isDraft, .isImmutable] | @tsv')" = "$(printf 'false\ttrue')" \
            || fail "release $RELEASE_TAG is not published as immutable"
          tag_is_validated || fail "tag $RELEASE_TAG changed during publication"
