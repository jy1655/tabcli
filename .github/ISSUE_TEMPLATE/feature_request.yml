name: Feature request
description: Request a change to Bridge in English or Korean.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Describe the Bridge workflow you need in English or Korean.
        Do not include private prompts, credentials, or identifying diagnostics.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe what you are doing with Bridge and where you get stuck.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Show what you want Bridge to do and how you handle the problem today.
    validations:
      required: true
  - type: input
    id: scope
    attributes:
      label: Which provider, terminal, and platform does this concern?
      description: >-
        Name the affected CLIs, terminals, and OS, or say that this concerns documentation.
    validations:
      required: true
  - type: textarea
    id: native-mechanism
    attributes:
      label: Does the provider offer a first-party mechanism?
      description: |
        Link the provider capability this could use, or describe the missing capability.
        For a fallback, identify what upstream support would replace it. Write "unknown" if you
        have not investigated this, or "not applicable" for documentation.
    validations:
      required: true
